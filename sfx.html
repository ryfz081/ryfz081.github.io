<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Sound Effects — Ryan Zhang</title>
  <link rel="stylesheet" href="style.css">
  <script src="site.js"></script>
</head>
<body>
  <header class="site-header">
    <div class="wrap">
      <a class="site-name" href="index.html">Ryan Zhang</a>
      <nav class="site-nav">
        <a href="index.html">About</a>
        <a href="research.html">Research</a>
        <a href="projects.html">Projects</a>
        <a href="writing.html">Writing</a>
        <a href="music.html" aria-current="page">Music</a>
        <a href="cv.html">CV</a>
      </nav>
    </div>
  </header>

  <main>
    <div class="wrap">
      <h1 class="page-title">Sound Effects</h1>
      <p class="page-intro"><a href="music.html">← Music</a></p>

      <section class="section section-grid">
        <p class="eyebrow">Tanbii</p>
        <div class="sfx-grid">
          <button class="sfx" data-src="media/music/sfx/questcomplete.mp3"><span class="state">Play</span><span class="name">Quest Complete</span><span class="bar"></span></button>
          <button class="sfx" data-src="media/music/sfx/sand.mp3"><span class="state">Play</span><span class="name">Bottle of Sand</span><span class="bar"></span></button>
          <button class="sfx" data-src="media/music/sfx/pageturn.mp3"><span class="state">Play</span><span class="name">Page Turn</span><span class="bar"></span></button>
          <button class="sfx" data-src="media/music/sfx/button.mp3"><span class="state">Play</span><span class="name">Button Tap</span><span class="bar"></span></button>
        </div>
      </section>

      <section class="section section-grid">
        <p class="eyebrow">Game Creation Society</p>
        <div class="sfx-grid">
          <button class="sfx" data-src="media/music/sfx/fogwoman.mp3"><span class="state">Play</span><span class="name">Woman of the Fog Jumpscare</span><span class="bar"></span></button>
          <button class="sfx" data-src="media/music/sfx/walkerscare.mp3"><span class="state">Play</span><span class="name">Giant Creature Jumpscare</span><span class="bar"></span></button>
          <button class="sfx" data-src="media/music/sfx/jellyfishscare.mp3"><span class="state">Play</span><span class="name">Phantom Jellyfish Jumpscare</span><span class="bar"></span></button>
          <button class="sfx" data-src="media/music/sfx/teleport.wav"><span class="state">Play</span><span class="name">Teleport Pad</span><span class="bar"></span></button>
        </div>
      </section>
    </div>
  </main>

  <script>
    const audio = new Audio();
    let active = null, raf = null;

    function reset(btn) {
      if (!btn) return;
      btn.classList.remove('playing');
      btn.querySelector('.state').textContent = 'Play';
      btn.querySelector('.bar').style.width = '0';
    }
    function tick() {
      if (active && audio.duration) active.querySelector('.bar').style.width = (audio.currentTime / audio.duration * 100) + '%';
      raf = requestAnimationFrame(tick);
    }
    audio.addEventListener('ended', () => { reset(active); active = null; cancelAnimationFrame(raf); });

    document.querySelectorAll('.sfx').forEach(btn => btn.addEventListener('click', () => {
      const same = active === btn;
      audio.pause(); reset(active); active = null; cancelAnimationFrame(raf);
      if (same) return;
      audio.src = btn.dataset.src; audio.currentTime = 0; audio.play();
      active = btn; btn.classList.add('playing'); btn.querySelector('.state').textContent = 'Stop';
      tick();
    }));
  </script>

  <footer class="site-footer">
    <div class="wrap"><p>© 2026 Ryan Zhang. Works created for Tanbii are owned by Tanbii.</p></div>
  </footer>
</body>
</html>
